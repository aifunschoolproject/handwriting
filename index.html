<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 發布時遞增版本，並更新已修改資源的 v，供 update.js 偵測新版。 -->
<meta name="app-version" content="2026.10.22.5">
<title>手寫練習</title>
<link rel="stylesheet" href="style.css?v=42">
</head>
<body class="handwriting-app">
<header class="topbar">
  <h1>✍️ 手寫練習</h1>
  <div class="filters">
    <label class="filter">
      <span>版本</span>
      <select id="selVersion"></select>
    </label>
    <label class="filter">
      <span>年級</span>
      <select id="selGrade"></select>
    </label>
    <label class="filter">
      <span>學期</span>
      <select id="selSemester">
        <option value="1">上學期</option>
        <option value="2">下學期</option>
      </select>
    </label>
    <label class="filter">
      <span>課次</span>
      <select id="selClass"></select>
    </label>
  </div>
  <div class="fs-ctl" id="fsCtl" role="group" aria-label="文字大小">
    <span class="fs-ctl-label">文字大小</span>
    <button type="button" data-fs="22">正常</button>
    <button type="button" data-fs="26.4">特大</button>
  </div>
  <div class="progress-pill" id="progressPill" role="status" aria-live="polite" title="本課已練習字數">0/0</div>
  <button class="btn btn-ghost-btn btn-choose" id="btnChoose">📖 選課</button>
  <details class="app-update" id="appUpdate">
    <summary>更新與版本</summary>
    <p id="updateStatus" role="status" aria-live="polite"></p>
    <button class="btn btn-ghost-btn" id="btnCheckUpdate" type="button">檢查更新</button>
    <button class="btn btn-ghost-btn" id="btnForceUpdate" type="button">強制更新</button>
  </details>
</header>

<!-- 進入引導：大圖卡選 版本／年級／學期／課次，點課卡即練 -->
<div class="setup" id="setup" role="region" aria-labelledby="setupTitle">
  <div class="setup-inner">
    <div class="setup-head">
      <span class="setup-title" id="setupTitle" tabindex="-1">今天想練哪一課？</span>
      <span class="setup-sub">選好版本和年級，再點一張課次卡，就可以開始。</span>
    </div>
    <div class="setup-steps" id="setupSteps"></div>
    <div class="setup-foot">
      <span class="setup-summary" id="setupSummary"></span>
      <button class="btn btn-accent" id="btnStart">▶ 開始練習</button>
    </div>
  </div>
</div>

<main>
  <div class="grid-head">
    <div class="grid-intro">
      <h2>選一個字，開始寫吧</h2>
      <p class="class-note" id="classNote"></p>
    </div>
    <button class="btn btn-ghost-btn" id="btnSetup" title="回選課">換一課</button>
  </div>
  <section class="grid" id="charGrid"></section>
</main>

<!-- 寫字詳細視窗 -->
<div class="detail" id="detail" role="dialog" aria-label="寫字練習" hidden>
  <div class="detail-inner">
    <div class="detail-head">
      <div class="detail-word">
        <div class="detail-char" id="dChar">字</div>
        <div class="detail-zhuyin" id="dZhuYin"></div>
      </div>
      <div class="detail-meta" id="dMeta"></div>
      <button class="btn btn-ghost-btn detail-back" id="btnClose" title="返回字卡">返回字卡</button>
    </div>
    <details class="detail-dict" id="dictBox">
      <summary>📖 教育部《國語辭典》</summary>
      <section class="dict-reader" aria-labelledby="dictTitle">
        <div class="dict-reader-head">
          <strong id="dictTitle">國語辭典</strong>
          <button class="btn btn-ghost-btn" type="button" id="btnDictClose">返回寫字</button>
        </div>
        <div class="dict-nav">
          <button class="btn btn-ghost-btn" type="button" id="btnDictUp" aria-label="字典往上一頁" aria-controls="dictBody">上一頁</button>
          <button class="btn btn-ghost-btn" type="button" id="btnDictDown" aria-label="字典往下一頁" aria-controls="dictBody">下一頁</button>
        </div>
        <div class="dict-body" id="dictBody" role="region" aria-label="國語辭典釋義，可上下滑動或按翻頁按鈕" tabindex="0"></div>
      </section>
    </details>
    <p class="practice-instruction" id="practiceInstruction" role="status" aria-live="polite">照著淡藍色的字，一筆一筆寫。</p>

    <div class="canvas-zone">
      <button class="side-arrow" id="btnPrev" title="上一字" aria-label="上一字">‹</button>
      <div class="canvas-stack">
        <div class="writer-wrap" id="writerWrap">
          <div class="writer-box" id="writerBox"></div>
        </div>
        <div class="done-flag" id="doneFlag" role="status">完成了！</div>
        <div class="writer-hint" id="writerHint"></div>
      </div>
      <button class="side-arrow" id="btnNext" title="下一字" aria-label="下一字">›</button>
    </div>

    <div class="detail-actions">
      <div class="practice-primary">
        <button class="btn" id="btnAnimate">看筆順</button>
        <button class="btn btn-accent" id="btnQuiz">自己寫</button>
        <button class="btn" id="btnClear">再寫一次</button>
      </div>
      <details class="practice-settings">
        <summary>顯示設定</summary>
        <div class="practice-options">
          <button class="btn btn-ghost-btn" id="btnGhost" aria-pressed="true">提示字：開</button>
          <button class="btn btn-ghost-btn" id="btnGrid" aria-pressed="true">格線：開</button>
        </div>
      </details>
    </div>

  </div>
</div>

<script src="hanzi-writer.min.js?v=1"></script>
<script src="data.js?v=1"></script>
<script src="dict.js?v=5"></script>
<script src="bpmf.js?v=8"></script>
<script src="app.js?v=43"></script>
<script src="update.js?v=4"></script>
</body>
</html>
